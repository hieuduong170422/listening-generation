name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 34.124.248.163 >> ~/.ssh/known_hosts

      - name: Deploy GCP service account key
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" | base64 -d | \
            ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "mkdir -p /opt/audivy/secrets && cat > /opt/audivy/secrets/gen-lang-client-0454656089-bd7514706035.json && chmod 600 /opt/audivy/secrets/gen-lang-client-0454656089-bd7514706035.json"

      - name: Update .env on server
        run: |
          echo "${{ secrets.ENV_FILE }}" | ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cat > /opt/audivy/.env"
          # Folder Drive nhận video affiliate (không phải secret) — giữ qua mỗi
          # lần ghi đè .env từ ENV_FILE; nếu secret đã có dòng này thì bỏ qua.
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "grep -q '^AFFILIATE_DRIVE_FOLDER_ID=' /opt/audivy/.env || echo 'AFFILIATE_DRIVE_FOLDER_ID=1f10KKSk6uxOwZ5JI1Grg0Fqrps112k4V' >> /opt/audivy/.env"

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='.env.server' \
            --exclude='secrets/' \
            --exclude='uploads/' \
            --exclude='history/' \
            --exclude='.venv/' \
            --exclude='*.db' \
            --exclude='*.wav' \
            --exclude='studio-web/node_modules/' \
            --exclude='studio-web/.next/' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ root@34.124.248.163:/opt/audivy/

      - name: Check what changed
        id: changed
        run: |
          # So với commit trước push (không phải HEAD~1) để push nhiều commit
          # một lần không bị sót thay đổi; force-push/push đầu thì fallback.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$' || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD)

          # Backend Python (api/ + src/) mount qua volume — chỉ cần restart
          # container là nhận code mới, không cần rebuild image.
          if echo "$CHANGED" | grep -qE '^(api/|src/)'; then
            echo "restart_api=true" >> $GITHUB_OUTPUT
          else
            echo "restart_api=false" >> $GITHUB_OUTPUT
          fi

          # Rebuild Streamlit Docker nếu requirements/Dockerfile thay đổi
          if echo "$CHANGED" | grep -qE '^(Dockerfile|requirements\.txt)$'; then
            echo "rebuild_streamlit=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild_streamlit=false" >> $GITHUB_OUTPUT
          fi

          # Rebuild API nếu api/ hoặc requirements-api.txt thay đổi
          if echo "$CHANGED" | grep -qE '^(api/Dockerfile|requirements-api\.txt|api/)'; then
            echo "rebuild_api=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild_api=false" >> $GITHUB_OUTPUT
          fi

          # Rebuild studio-web nếu studio-web/ thay đổi
          if echo "$CHANGED" | grep -qE '^studio-web/'; then
            echo "rebuild_web=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild_web=false" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild Streamlit (if needed)
        if: steps.changed.outputs.rebuild_streamlit == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cd /opt/audivy && docker compose build streamlit"

      - name: Rebuild API (if needed)
        if: steps.changed.outputs.rebuild_api == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cd /opt/audivy && docker compose build podcast-api"

      - name: Rebuild studio-web (if needed)
        if: steps.changed.outputs.rebuild_web == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cd /opt/audivy && docker compose build studio-web"

      - name: Deploy all services
        run: |
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cd /opt/audivy && docker compose up -d"

      - name: Restart API (apply code-only changes)
        if: steps.changed.outputs.restart_api == 'true'
        run: |
          # up -d không recreate khi image không đổi; code Python mount volume
          # nên phải restart mới nạp bản mới. Token nằm SQLite → user không bị logout.
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cd /opt/audivy && docker compose restart podcast-api"

      - name: Restart nginx to apply config
        run: |
          ssh -i ~/.ssh/id_ed25519 root@34.124.248.163 \
            "cd /opt/audivy && docker compose restart nginx"
