services:
  audivy:
    build: .
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      - KALODATA_DB_PATH=/data/kalodata.db
      - DATABASE_PATH=/data/templates.db
    volumes:
      - /opt/audivy:/app
      - audivy_data:/data
      - audivy_uploads:/app/uploads
      - audivy_history:/app/history

volumes:
  audivy_data:
  audivy_uploads:
  audivy_history:
