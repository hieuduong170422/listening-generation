services:
  streamlit:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - KALODATA_DB_PATH=/data/kalodata.db
      - DATABASE_PATH=/data/templates.db
    volumes:
      - /opt/audivy:/app
      - audivy_data:/data
      - audivy_uploads:/app/uploads
      - audivy_history:/app/history

  podcast-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HISTORY_DIR=/app/history
    volumes:
      - /opt/audivy:/app
      - audivy_history:/app/history

  studio-web:
    build:
      context: studio-web
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - API_TARGET_URL=http://podcast-api:8000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/audivy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit
      - podcast-api
      - studio-web

volumes:
  audivy_data:
  audivy_uploads:
  audivy_history:
